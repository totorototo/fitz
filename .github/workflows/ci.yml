name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # With no version given, setup-zig reads minimum_zig_version from build.zig.zon, so the
      # version lives in one place.
      - uses: mlugg/setup-zig@v2
      - run: zig fmt --check build.zig build.zig.zon src
      # TIGER_STYLE line limit (see CLAUDE.md); zig fmt doesn't enforce it.
      - name: Lines are 100 columns or fewer
        run: awk 'length > 100 { print FILENAME ":" FNR; bad = 1 } END { exit bad }' build.zig src/*.zig

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # ReleaseSafe keeps the assertions but changes codegen, so it can expose bugs Debug hides.
        optimize: [Debug, ReleaseSafe]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
      - run: zig build -Doptimize=${{ matrix.optimize }}
      - run: zig build test -Doptimize=${{ matrix.optimize }} --summary all
